<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Forger Digital Solutions brand mark">
  <defs>
    <radialGradient id="fds-disc" cx="32" cy="30" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101726" />
      <stop offset="60%" stop-color="#080b12" />
      <stop offset="100%" stop-color="#040609" />
    </radialGradient>
    <linearGradient id="fds-rim" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#406fc9" />
      <stop offset="50%" stop-color="#1e3460" />
      <stop offset="100%" stop-color="#0e172a" />
    </linearGradient>
    <linearGradient id="fds-orbit-primary" x1="10" y1="18" x2="54" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="fds-orbit-secondary" x1="16" y1="46" x2="48" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="fds-forge-facet-top" x1="24" y1="20" x2="40" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="fds-forge-facet-right" x1="32" y1="30" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="fds-forge-facet-left" x1="20" y1="30" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <radialGradient id="fds-core-glow" cx="32" cy="31" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canonical FDS Forge and Orbital Brand Symbol -->
  <circle cx="32" cy="32" r="30" fill="url(#fds-disc)" stroke="url(#fds-rim)" stroke-width="1.8" />
  <circle cx="32" cy="32" r="28" fill="none" stroke="#0e172a" stroke-width="0.8" opacity="0.6" />

  <!-- Background orbital glow aura -->
  <circle cx="32" cy="31" r="12" fill="url(#fds-core-glow)" />

  <!-- Intersecting orbital tracks -->
  <ellipse cx="32" cy="32" rx="23" ry="9.5" transform="rotate(-22 32 32)" fill="none" stroke="url(#fds-orbit-primary)" stroke-width="2.6" stroke-linecap="round" />
  <ellipse cx="32" cy="32" rx="21" ry="8" transform="rotate(38 32 32)" fill="none" stroke="url(#fds-orbit-secondary)" stroke-width="1.6" stroke-dasharray="18 10 32 6" opacity="0.85" />

  <!-- Central Forge / Core Diamond Mark -->
  <polygon points="32,18 43,30 32,46 21,30" fill="#020408" opacity="0.6" />
  <polygon points="32,18 43,30 32,33 21,30" fill="url(#fds-forge-facet-top)" />
  <polygon points="21,30 32,33 32,46" fill="url(#fds-forge-facet-left)" />
  <polygon points="43,30 32,33 32,46" fill="url(#fds-forge-facet-right)" />
  <line x1="32" y1="18" x2="32" y2="46" stroke="#ffffff" stroke-width="0.75" opacity="0.75" stroke-linecap="round" />

  <!-- Core singularity spark -->
  <circle cx="32" cy="31.5" r="1.8" fill="#ffffff" />
  <circle cx="32" cy="31.5" r="3.2" fill="#60a5fa" opacity="0.4" />

  <!-- Orbital constellation nodes -->
  <circle cx="50" cy="22" r="1.6" fill="#93c5fd" />
  <circle cx="14" cy="42" r="1.4" fill="#93c5fd" opacity="0.8" />
  <circle cx="43" cy="46" r="1.2" fill="#60a5fa" opacity="0.65" />
</svg>
