name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  security:
    name: Dependency Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup pnpm for Worker
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: npm ci

      - name: Website dependency audit
        run: |
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Install Worker dependencies
        run: pnpm --dir worker install --frozen-lockfile

      - name: Worker dependency audit
        run: pnpm --dir worker audit --audit-level high

  build:
    name: Unit, Kayla Gates & Production Build
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Setup pnpm for Worker
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: npm ci
      - name: Install Worker dependencies
        run: pnpm --dir worker install --frozen-lockfile
      - name: Kayla production gates
        run: npm test && npm run kayla:deploy:check && npm run worker:build

      - name: Build website
        run: npm run validate
        env:
          PUBLIC_KAYLA_API_URL: ${{ vars.PUBLIC_KAYLA_API_URL }}
      - name: Scan generated assets for secrets
        run: npm run kayla:secret-scan

      - name: Upload built site for browser certification
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 7

  browser-certification:
    name: Playwright Browser Certification
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium firefox webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox webkit

      - name: Run browser certification suite
        run: npm run test:e2e

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload visual certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-certification-captures
          path: shots-ci
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, browser-certification]

    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
