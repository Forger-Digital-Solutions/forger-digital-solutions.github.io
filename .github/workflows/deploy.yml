name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Setup pnpm for Worker
        uses: pnpm/action-setup@v4
        with:
          version: 11
      
      - name: Install dependencies
        run: npm ci
      - name: Install Worker dependencies
        run: pnpm --dir worker install --frozen-lockfile
      - name: Kayla production gates
        run: npm test && npm run kayla:deploy:check && npm run worker:build
      
      - name: Build website
        run: npm run validate
        env:
          PUBLIC_KAYLA_API_URL: ${{ vars.PUBLIC_KAYLA_API_URL }}
      - name: Scan generated assets for secrets
        run: npm run kayla:secret-scan
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
  
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
